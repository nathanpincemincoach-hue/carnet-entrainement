<title>Carnet d’entrainement</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout : carnet d'entraînement mobile-first. Barre d'onglets en bas sur téléphone, en haut sur ordinateur.
   Couleurs des priorités = disques olympiques (vert 10 kg, jaune 15 kg, rouge 25 kg) ; accent = disque bleu 20 kg. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunken:#E4E7EC; --ink:#14171D; --muted:#5B6270; --line:#D5D9E0;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#DCE5FB;
  --ss1:#1D4ED8; --ss2:#7C3AED; --ss3:#0E8F84; --ss4:#D9740F; --ss5:#C026D3; --ss6:#8A5A2B;
  --green:#17844A; --yellow:#A87700; --yellow-fill:#F2C230; --red:#CF3428;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,23,29,.06),0 4px 14px rgba(20,23,29,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#181B21; --sunken:#121419; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2A2F38;
  --accent:#6A8FFF; --accent-ink:#0B0F1A; --accent-soft:#1D2742;
  --ss1:#6A8FFF; --ss2:#A78BFA; --ss3:#2DD4BF; --ss4:#FB923C; --ss5:#E879F9; --ss6:#D4A373;
  --green:#3FBF76; --yellow:#F2C230; --yellow-fill:#F2C230; --red:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#181B21; --sunken:#121419; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2A2F38;
  --accent:#6A8FFF; --accent-ink:#0B0F1A; --accent-soft:#1D2742;
  --ss1:#6A8FFF; --ss2:#A78BFA; --ss3:#2DD4BF; --ss4:#FB923C; --ss5:#E879F9; --ss6:#D4A373;
  --green:#3FBF76; --yellow:#F2C230; --yellow-fill:#F2C230; --red:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:23px} h3{font-size:18px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo{width:28px;height:28px;flex:none;overflow:visible}
.logo-star{fill:var(--ink)}
.logo-w{fill:none;stroke:var(--accent);stroke-width:3.6;stroke-linecap:round}
.logo-w2{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;opacity:.35}
.logo-dot{fill:var(--red)}
.who{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.who.off i{background:var(--yellow-fill)} .who.sync i{background:var(--accent)}
.plates{display:inline-flex;gap:2px}
.plates i{display:block;width:5px;border-radius:2px}
.plates i:nth-child(1){height:18px;background:var(--red)}
.plates i:nth-child(2){height:16px;background:var(--accent)}
.plates i:nth-child(3){height:14px;background:var(--yellow-fill)}
.plates i:nth-child(4){height:12px;background:var(--green)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab svg{width:18px;height:18px}
main{max-width:1180px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1}
  .tab[aria-current="page"]{background:var(--accent-soft);box-shadow:none;color:var(--accent)}
  main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  h1{font-size:26px}
}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ghost{background:none;border-color:transparent}
.btn.big{padding:12px 18px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;font-weight:700;padding:0}
.iconbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=text],input[type=number],input[type=url],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap}
.tag.g{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.tag.y{background:color-mix(in srgb,var(--yellow-fill) 22%,transparent);color:var(--yellow)}
.tag.r{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.tag.b{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:8px;padding:10px 12px;background:var(--sunken);font-size:14px}
.note.warn{background:color-mix(in srgb,var(--yellow-fill) 18%,transparent)}
.note.bad{background:color-mix(in srgb,var(--red) 12%,transparent)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].off{background:var(--sunken);color:var(--ink)}
.seg button[aria-pressed="true"].g{background:var(--green);color:#fff}
.seg button[aria-pressed="true"].y{background:var(--yellow-fill);color:#2a2000}
.seg button[aria-pressed="true"].r{background:var(--red);color:#fff}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.stepper button{border:0;background:none;width:30px;height:32px;font-weight:700;font-size:16px}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar.g i{background:var(--green)} .bar.y i{background:var(--yellow-fill)} .bar.r i{background:var(--red)} .bar.b i{background:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:761px){.overlay{align-items:center}.sheet{border-radius:14px}}
.sheet .list{overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%}
.pick:hover{border-color:var(--accent)}

/* séance */
.sess-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:100%}
.sess-btn.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sess-btn b{font-family:var(--display);font-size:21px}
.ex{padding:14px 16px}
.ex-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-name{font-weight:700;font-size:17px}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 44px;gap:6px;align-items:center;margin-top:10px}
.sets .hd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sets input,.sets select{padding:8px 6px;text-align:center;font-size:16px}
.sets .idx{font-weight:700;color:var(--muted);text-align:center}
.done-btn{width:44px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;color:var(--muted)}
.done-btn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.ss-wrap{border-left:6px solid var(--ssc,var(--accent));border-radius:var(--r)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (max-width:760px){.timer{bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:10px}}
.timer-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .t{font-family:var(--display);font-size:30px;font-weight:700;min-width:80px}
.timer .bar{flex:1;background:rgba(127,127,127,.35)}
.timer .bar i{background:var(--yellow-fill)}
.timer button{background:none;border:1px solid rgba(127,127,127,.6);color:inherit;border-radius:8px;padding:6px 10px;font-weight:600}
.timer.over .t{color:var(--yellow-fill)}

/* builder */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center;color:var(--muted)}
.stp .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunken);font-size:12px}
.stp[aria-current="step"]{color:var(--ink);border-color:var(--ink)}
.stp[aria-current="step"] .n{background:var(--ink);color:var(--bg)}
.mrow{display:grid;grid-template-columns:minmax(0,1.1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
@media (max-width:560px){.mrow{grid-template-columns:1fr auto}.mrow .seg{grid-column:1 / -1;order:3;justify-self:start}}
.b4{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1000px){.b4{grid-template-columns:1fr}}
.vol-panel{position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}
@media (max-width:1000px){.vol-panel{position:static;order:-1}}
.vrow{display:grid;grid-template-columns:92px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.sessions{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.sess-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sess-h input.title{font-family:var(--display);font-size:20px;font-weight:700;border-color:transparent;background:none;padding:2px 4px}
.sess-h input.title:hover,.sess-h input.title:focus{border-color:var(--line)}
.item{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item.ss{border-left:6px solid var(--ssc,var(--accent));padding-left:8px;background:color-mix(in srgb,var(--ssc,var(--accent)) 7%,transparent)}
.ssl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ssc)}
.exlist{display:flex;flex-direction:column;gap:2px;width:100%;margin-top:6px;font-size:13px;text-align:left}
.exl{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;border-left:3px solid transparent}
.exl.ss{border-left-color:var(--ssc);background:color-mix(in srgb,var(--ssc) 10%,transparent)}
.ssb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--ssc);color:#fff;font-size:11px;font-weight:700;flex:none}
.ssb.none{background:none}
.ssl b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--ssc);color:#fff;font-size:12px}
.item-name{border:0;background:none;text-align:left;font-weight:700;padding:0;font-size:15px}
.item-name.todo{color:var(--red)}
.item-ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item-ctrl input{width:64px;padding:6px;text-align:center}
.item-ctrl select{width:auto;padding:6px}
.item-top{display:flex;align-items:flex-start;gap:6px}

.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:2px}

.scroll{overflow-x:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line)}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.5}
.chart .ar{fill:var(--accent-soft)}
.chart .pt{fill:var(--accent)}
.chart .last{fill:var(--surface);stroke:var(--accent);stroke-width:3}

details>summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab,.done-btn{transition:background .15s,border-color .15s,color .15s}}

/* ---------- Référentiel Système Fluide ---------- */

/* ---------- utilitaires ---------- */

const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};

function ago(d){const days=Math.round((new Date(dayKey(Date.now()))-new Date(dayKey(d)))/864e5);return days<=0?"aujourd’hui":days===1?"hier":"il y a "+days+" j"}

function split(total,n){n=Math.max(1,n);const b=Math.floor(total/n),r=total%n;return Array.from({length:n},(_,i)=>b+(i<r?1:0)).filter(x=>x>0)}

/* ---------- base de données ---------- */
const writing={};
async function save(path,data){if(!S.db){toast("Données non accessibles ici");return}

  while(w.next){const d=w.next;w.next=null;try{await S.db.doc(path).set(d)}catch(e){toast(errMsg(e))}}w.busy=false}

function errMsg(e){const c=e&&e.code;if(c==="invalid_argument")return"Enregistrement refusé : tu n’as pas les droits d’écriture sur ce carnet.";
  if(c==="quota_exceeded")return"Le carnet est plein : supprime d’anciennes séances.";if(c==="resource_exhausted")return"Trop d’enregistrements d’un coup, réessaie dans un instant.";
  return"Enregistrement impossible pour l’instant, réessaie."}

const ROUTES=[["seance","Séance"],["programmes","Programmes"],["suivi","Suivi"],["exercices","Exercices"]];
function go(r){if(r===S.route&&!S.builder&&!S.exEdit)return;S.route=r;S.builder=null;S.exEdit=null;S.confirm=null;if(location.hash!=="#"+r)location.hash=r;render();window.scrollTo(0,0)}

  const tabs=document.getElementById("tabs");tabs.replaceChildren(...ROUTES.map(([k,l])=>h("button",{class:"tab","aria-current":S.route===k?"page":null,onclick:()=>go(k)},icon(k),l)));

function viewNoDb(){return h("div",{class:"empty card"},h("h2",null,"Carnet indisponible ici"),
  h("p",null,"Ouvre cette page sur claude.ai en étant connecté pour retrouver tes programmes et ton historique."))}

/* ---------- calculs ---------- */
function activeProgram(){const id=S.config.activeProgramId;return id&&S.programs.get(id)||null}
function exOf(it){return it.exId&&S.exercises.get(it.exId)||null}
function itemView(it){const e=exOf(it);return{name:e?e.name:it.name,muscle:e?e.muscle:it.muscle,type:e?e.type:it.type,video:e?e.video:null}}
function prioOf(p,m){return(p&&p.priorities&&p.priorities[m])||{level:"off",target:0}}
function plannedVolume(p){const v={},f={};for(const s of p.sessions||[]){const seen=new Set();for(const it of s.items||[]){const m=itemView(it).muscle;if(!m)continue;v[m]=(v[m]||0)+(+it.sets||0);seen.add(m)}seen.forEach(m=>f[m]=(f[m]||0)+1)}return{v,f}}

  return items&&items.length?Math.round(sec/60)+5:0}
function ssMapOf(its){its=its||[];const m={};let k=0;its.forEach(i=>{if(i.ss&&!m[i.ss]&&its.filter(x=>x.ss===i.ss).length>1){m[i.ss]={i:k,l:"ABCDEFGH"[k%8]};k++}});return m}
function exList(its){its=its||[];const m=ssMapOf(its);return h("div",{class:"exlist"},its.map(it=>{const v=itemView(it),sl=it.ss&&m[it.ss];
  return h("div",{class:"exl"+(sl?" ss":""),style:sl?"--ssc:var(--ss"+(sl.i%6+1)+")":null},sl?h("span",{class:"ssb","aria-label":"Superset "+sl.l},sl.l):h("span",{class:"ssb none"}),
    h("span",{class:"grow"},v.name),h("span",{class:"muted num",style:"white-space:nowrap"},it.sets+" × "+(it.reps||"")))}))}
function programMuscles(p){const set=new Set(MUSCLES.map(m=>m.n));for(const e of S.exercises.values())if(e.muscle)set.add(e.muscle);for(const m in (p&&p.priorities)||{})set.add(m);return[...set]}

function e1rm(kg,reps){return kg&&reps?kg*(1+reps/30):0}

  return its}
function makeItem(ex,muscle,sets){const type=ex?ex.type:"Isolation";return{id:uid(),exId:ex?ex.id:null,name:ex?ex.name:"À choisir · "+muscle,muscle:ex?ex.muscle:muscle,type,sets,reps:repsDef(type),rir:"0-2",rest:restDef(type),ss:null}}

  const load=sessions.map(()=>0),used=sessions.map(()=>new Set()),rot={},lvl={};
  const list=Object.entries(p.priorities||{}).filter(([m,v])=>v.level!=="off"&&v.target>0).sort((a,b)=>RANK[b[1].level]-RANK[a[1].level]||b[1].target-a[1].target);
  for(const [m,v] of list){lvl[m]=RANK[v.level];let el=sessions.map((_,i)=>i).filter(i=>eligible(sessions[i].kind,m));if(!el.length)el=sessions.map((_,i)=>i);
    const T=v.target;const f=Math.min(T<=4?1:T<=9?2:3,el.length);
    const pick=[...el].sort((a,b)=>load[a]-load[b]||a-b).slice(0,f).sort((a,b)=>a-b);const parts=split(T,pick.length);

    pick.forEach((si,k)=>{for(const sets of split(parts[k],Math.ceil(parts[k]/4))){let ex=null;
      for(let t=0;t<cands.length;t++){const c=cands[((rot[m]||0)+t)%cands.length];if(!used[si].has(c.id)){ex=c;rot[m]=(rot[m]||0)+t+1;break}}

    h("div",{class:"card pad stack"},h("div",null,h("h3",null,"Temps dispo aujourd’hui"),h("div",{class:"small muted"},"La séance est raccourcie si besoin : les muscles en maintenance perdent des séries en premier, les prioritaires en dernier.")),h("div",{class:"chips"},dispoChips)),
    sessions.length?h("div",{class:"grid"},sessions.map((s,i)=>{const full=estimate(s.items),its=S.dispo&&full>S.dispo?trim(s.items,p,S.dispo):s.items;
      const setsFull=s.items.reduce((a,b)=>a+(+b.sets||0),0),setsNow=its.reduce((a,b)=>a+(+b.sets||0),0);const l=lastBySess[s.id];
      return h("button",{class:"sess-btn"+(i===nextIdx?" next":""),disabled:!s.items.length||null,onclick:()=>startLive(p,s)},
        i===nextIdx?h("span",{class:"tag b"},"Prochaine"):null,h("b",null,s.name),

    db.collection("exercises").onSnapshot(sn=>{S.exercises=new Map(sn.docs.map(d=>[d.id,{id:d.id,...clone(d.data())}]));if(!sn.metadata.fromCache)done("exercises");scheduleRender()},fail);
    db.collection("programs").onSnapshot(sn=>{S.programs=new Map(sn.docs.map(d=>[d.id,{id:d.id,...clone(d.data())}]));if(!sn.metadata.fromCache)done("programs");scheduleRender()},fail);
    db.collection("logs").orderBy("date","desc").limit(1000).onSnapshot(sn=>{S.logs=sn.docs.map(d=>({id:d.id,...clone(d.data())}));if(!sn.metadata.fromCache)done("logs");scheduleRender()},fail);
    db.doc("config/main").onSnapshot(sn=>{S.config=sn.exists?clone(sn.data()):{};if(!sn.metadata.fromCache)done("config");scheduleRender()},fail);
  };
  if(window.claude&&window.claude.use){window.claude.use("db").then(async db=>{
      if(!db){clearTimeout(slow);S.status="nodb";render();return}
      try{const u=await window.claude.use("user");if(u){const own=await u.isOwner();if(own===false)S.readOnly=true}}catch(e){}
      connect(db)}).catch(()=>{S.status="nodb";render()})}
  else{S.local=true;
    if(S.profile){loadSync();connect(localDb("carnet-db-"+S.profile.code,markDirty));renderWho();syncNow();
      setInterval(()=>{if(document.visibilityState==="visible")syncNow()},45000);
      window.addEventListener("online",()=>syncNow());document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow()})}
    else connect(localDb("carnet-db-v1"));
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  if(S.live){S.route="seance";wakeLock()}})();
</script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
